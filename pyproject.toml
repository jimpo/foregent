[project]
name = "foregent"
version = "0.1.0"
description = "Autonomous multi-agent software development system — management CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "watchfiles>=0.24",
    # server.py imports mcp.server.fastmcp; mcp 2.x renamed FastMCP to MCPServer.
    "mcp>=1.2,<2",
    "gql[requests]>=3.5",
]

[project.scripts]
foregent = "foregent.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ty>=0.0.1a1"]

[tool.ty.environment]
python-version = "3.13"
